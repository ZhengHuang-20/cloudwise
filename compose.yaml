# 服务器上的 deploy 脚本会执行 `docker compose build` 与 `docker compose up -d --force-recreate`。
services:
  cloudwise:
    build: .
    image: cloudwise:latest
    container_name: cloudwise
    restart: unless-stopped
    # 使用宿主机网络，容器里的 127.0.0.1:3306 就是服务器上的 MySQL，无需改 MySQL 的监听地址或授权。
    # 服务只监听回环地址，对外仍由宿主机上的反向代理转发到 127.0.0.1:3000（与之前的端口发布一致）。
    network_mode: host
    environment:
      PORT: "3000"
      LISTEN_HOST: 127.0.0.1
      TRUST_PROXY: "true"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: cloudwise
      MYSQL_USER: cloudwise
      # GitHub Actions 把 Secrets 拼在 SSH 命令里（deploy CW_ENV=<hex>）；deploy 脚本运行在 SSH 会话中，
      # SSH_ORIGINAL_COMMAND 会被 docker compose 继承。后端启动时解出并保存到 /state 卷。
      CW_DEPLOY_ENV: ${SSH_ORIGINAL_COMMAND:-}
    volumes:
      - cw_state:/state

volumes:
  cw_state:
