name: Deploy to Production

# 触发方式：
#   1. 推送到 main 分支 —— 自动部署
#   2. Actions 页面手动点 Run workflow —— 强制重新部署（即使代码没变）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免连续 push 时并发构建打爆服务器
concurrency:
  group: deploy-cloudwise-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署到火山引擎
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 校验 Secrets 是否配置
        run: |
          MISSING=""
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then MISSING="$MISSING DEPLOY_SSH_KEY"; fi
          if [ -z "${{ secrets.SSH_HOST }}" ];       then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ];       then MISSING="$MISSING SSH_USER"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::以下 Secret 未配置或值为空：$MISSING"
            echo ""
            echo "请在仓库 Settings → Secrets and variables → Actions 中补齐："
            echo "  DEPLOY_SSH_KEY  部署私钥全文（必须含 BEGIN / END 两行）"
            echo "  SSH_HOST        服务器公网 IP"
            echo "  SSH_USER        SSH 登录用户名"
            echo ""
            echo "注意：要加在 Secrets 标签页，不是 Variables 标签页。"
            exit 1
          fi

          echo "三个 Secret 均已配置"

      - name: 准备 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -l -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY 不是有效的私钥。常见原因："
            echo "  1. 复制时漏掉了 -----BEGIN/-----END 行"
            echo "  2. 中间被换行截断或多了空格"
            echo "  3. 误把 .pub 公钥粘贴进去了"
            echo "私钥内容开头应为 -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          echo "私钥指纹：$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"

          HOST="${{ secrets.SSH_HOST }}"
          echo "SSH_HOST 诊断：长度=${#HOST}  首3位=${HOST:0:3}  末3位=${HOST: -3}"

          SCAN_OUT=$(ssh-keyscan -T 10 -H "$HOST" 2>&1) || true
          if ! printf '%s' "$SCAN_OUT" | grep -q '^ssh-'; then
            echo "::error::无法获取主机密钥｜SSH_HOST 长度=${#HOST} 首3位=${HOST:0:3} 末3位=${HOST: -3}｜ssh-keyscan 输出：${SCAN_OUT:-（空）}"
            echo "排查清单："
            echo "  1. SSH_HOST 必须是纯 IP，不能带 http:// 或 :22 或空格"
            echo "  2. 安全组需放行 22 端口"
            echo "  3. 服务器必须在运行中"
            echo "  4. 服务器侧可能把 GitHub Runner 的 IP 封禁了"
            exit 1
          fi
          printf '%s\n' "$SCAN_OUT" >> ~/.ssh/known_hosts
          echo "已记录主机密钥"

      - name: 触发远程部署
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="deploy force"
          else
            CMD="deploy"
          fi
          echo "远程指令：$CMD"

          set +e
          OUT=$(ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "$CMD" 2>&1)
          RC=$?
          set -e

          printf '%s\n' "$OUT"

          if [ "$RC" -ne 0 ]; then
            SUMMARY=$(printf '%s' "$OUT" | tail -4 | tr '\n' ' ')
            echo "::error::SSH 部署失败（退出码 $RC）。末尾输出：$SUMMARY"
            exit "$RC"
          fi

      - name: 部署后健康检查
        run: |
          sleep 3
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   "http://${{ secrets.SSH_HOST }}/api/health" || echo 000)
            echo "第 $i 次探测 /api/health -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "站点健康："
              curl -s --max-time 15 "http://${{ secrets.SSH_HOST }}/api/health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::健康检查未通过，请登录服务器执行 docker logs cloudwise 排查"
          exit 1

      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
