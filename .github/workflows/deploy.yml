name: Deploy to Production

# 触发方式：
#   1. 推送到 main 分支 —— 自动部署
#   2. Actions 页面手动点 Run workflow —— 强制重新部署（即使代码没变）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免连续 push 时并发构建打爆服务器
concurrency:
  group: deploy-cloudwise-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署到火山引擎
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── ① 清洗 Secret（本次故障的根因所在）──────────────────────────────
      # 从网页粘贴 Secret 时极易带进尾部换行/空格。症状很好认：
      #   SSH_HOST 长度 = 14（正确应为 13），末 3 位显示 00 而不是 100。
      # 阴险之处：ssh-keyscan 容忍首尾空白、能正常返回，所以问题不会在这一步暴露；
      # 但后面 ssh 会直接失败 —— "hostname contains invalid characters"。
      # 结论：不要指望 Secret 粘得干净，统一在这里清洗后再用。
      - name: 清洗并校验 Secrets
        run: |
          HOST_RAW="${{ secrets.SSH_HOST }}"
          USER_RAW="${{ secrets.SSH_USER }}"
          KEY_RAW="${{ secrets.DEPLOY_SSH_KEY }}"

          HOST="$(printf '%s' "$HOST_RAW" | tr -d '[:space:]')"
          USER="$(printf '%s' "$USER_RAW" | tr -d '[:space:]')"

          echo "SSH_HOST 清洗前：长度=${#HOST_RAW} 首3位=${HOST_RAW:0:3} 末3位=${HOST_RAW: -3}"
          echo "SSH_HOST 清洗后：长度=${#HOST} 值=$HOST"
          echo "SSH_USER 清洗后：$USER"

          MISSING=""
          if [ -z "$HOST" ];    then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "$USER" ];    then MISSING="$MISSING SSH_USER"; fi
          if [ -z "$KEY_RAW" ]; then MISSING="$MISSING DEPLOY_SSH_KEY"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::以下 Secret 未配置或值为空：$MISSING"
            echo ""
            echo "请在仓库 Settings → Secrets and variables → Actions 中补齐："
            echo "  DEPLOY_SSH_KEY  部署私钥全文（必须含 BEGIN / END 两行）"
            echo "  SSH_HOST        服务器公网 IP（不要带换行/空格）"
            echo "  SSH_USER        SSH 登录用户名"
            echo ""
            echo "注意：要加在 Secrets 标签页，不是 Variables 标签页。"
            exit 1
          fi

          # 清洗后仍不像 IP / 主机名，说明 Secret 里混进了别的字符
          if ! printf '%s' "$HOST" | grep -Eq '^[0-9A-Za-z._:-]+$'; then
            echo "::error::SSH_HOST 清洗后仍含非法字符：[$HOST]"
            exit 1
          fi

          # 通过 GITHUB_ENV 传给后续步骤，后续一律用 $SSH_HOST / $SSH_USER
          {
            echo "SSH_HOST=$HOST"
            echo "SSH_USER=$USER"
          } >> "$GITHUB_ENV"

          echo "三个 Secret 均已配置且已清洗"

      # ── ② 准备 SSH 密钥 + 记录主机密钥 ─────────────────────────────────
      - name: 准备 SSH 密钥
        run: |
          mkdir -p ~/.ssh

          # tr -d '\r' 兼容从 Windows 复制粘贴带进的回车符
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -l -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY 不是有效的私钥。常见原因："
            echo "  1. 复制时漏掉了 -----BEGIN/-----END 行"
            echo "  2. 中间被换行截断或多了空格"
            echo "  3. 误把 .pub 公钥粘贴进去了"
            echo "私钥内容开头应为 -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          echo "私钥指纹：$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"

          # 先做纯 TCP 探测，把「网络不通」和「端口有监听但不发 SSH banner」区分开
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "::error::$SSH_HOST:22 TCP 不可达（安全组未放行 / 服务器未运行 / 被云厂商 HIDS 拦截）"
            exit 1
          fi
          echo "TCP 22 端口可达"

          # ssh-keyscan 重试 3 次
          SCAN_OK=0
          for n in 1 2 3; do
            SCAN_OUT=$(ssh-keyscan -T 10 -H "$SSH_HOST" 2>&1) || true
            # -H 会把主机名哈希，密钥行以 "|1|" 开头而不是 "ssh-"；
            # 只要存在非注释行（# 开头的是 banner）且含密钥类型，就算成功
            if printf '%s' "$SCAN_OUT" | grep -Eq '^[^#].* (ssh-|ecdsa-|sk-)'; then
              SCAN_OK=1
              break
            fi
            echo "第 $n 次 ssh-keyscan 未拿到主机密钥，3 秒后重试…"
            sleep 3
          done

          if [ "$SCAN_OK" != "1" ]; then
            echo "::error::无法获取主机密钥｜SSH_HOST 长度=${#SSH_HOST} 值=$SSH_HOST｜ssh-keyscan 输出：${SCAN_OUT:-（空）}"
            echo "排查清单："
            echo "  1. SSH_HOST 必须是纯 IP，不能带 http:// 或 :22 或空格"
            echo "  2. 安全组需放行 22 端口"
            echo "  3. 服务器必须在运行中"
            echo "  4. TCP 通但没有 banner —— sshd 未认证连接被占满 / 22 端口被容器抢占 / HIDS 拦截"
            echo "     自我取证：云控制台 → 实例 → 远程连接（VNC，不走 22 端口）"
            exit 1
          fi

          printf '%s\n' "$SCAN_OUT" | grep -v '^#' >> ~/.ssh/known_hosts
          echo "已记录主机密钥：$(grep -c . ~/.ssh/known_hosts) 条"

      # ── ③ 触发远程部署 ────────────────────────────────────────────────
      # 服务器上的 deploy 脚本是 SSH 强制命令，无法直接传文件；运行时配置（Gemini key、MySQL 密码等）
      # 改为：把 Secrets 编码成 hex 拼在命令后面（deploy CW_ENV=<hex>）。deploy 脚本运行在该 SSH 会话里，
      # SSH_ORIGINAL_COMMAND 会被 docker compose 继承；compose 文件里需要有 CW_DEPLOY_ENV: ${SSH_ORIGINAL_COMMAND:-}（见 deploy/compose.host.yaml，
      # 目前线上的 compose 还没有这一行，所以密钥暂未生效）。后端启动时解出并保存到卷里。
      # 用 hex 而不是 base64：hex 里不会出现 "force" 这个词，不会误触发脚本对 force 的检测。
      # 注意：命令里含密钥，绝不能回显；编码后的值不会被 GitHub 自动打码，所以下面显式 add-mask。
      #
      # 需要的 Secrets（仓库 Settings → Secrets and variables → Actions → Secrets）：
      #   MYSQL_APP_PASSWORD     应用专用账号 cloudwise 的密码（12 位以上，仅字母数字和 _.@#%+=-，不含引号）
      #   MYSQL_ADMIN_USER       （首次部署需要）有建库/建用户权限的 MySQL 管理员账号，如 dba
      #   MYSQL_ADMIN_PASSWORD   （首次部署需要）其密码；初始化成功后可以删除这两个 Secret
      #   ADMIN_EMAIL            （可选）首个后台管理员邮箱，仅在该邮箱不存在时创建
      #   ADMIN_INITIAL_PASSWORD （可选）其初始密码（10 位以上），首次登录会被要求修改
      #   GEMINI_API_KEY         （可选）不配则 AI 接口使用内置 fallback；AI 可见性测评的分析也依赖它
      #   OPENAI_API_KEY         （可选）AI 可见性测评向 ChatGPT（Responses API + web_search）提问
      #   PERPLEXITY_API_KEY     （可选）AI 可见性测评向 Perplexity（Sonar）提问；也可以填 OpenRouter 的 key，
      #                          同时把 PERPLEXITY_BASE_URL 设为 https://openrouter.ai/api/v1
      #   OPENROUTER_API_KEY     （推荐）ChatGPT / Perplexity / Gemini 三个测评平台统一经 OpenRouter 提问，
      #                          配了就优先于下面的直连 key；可选 OPENROUTER_CHATGPT_MODEL / _PERPLEXITY_MODEL / _GEMINI_MODEL
      #   OPENAI_BASE_URL / PERPLEXITY_BASE_URL （可选）国内服务器直连不通时，填海外中转网关地址
      #   OPENAI_MODEL / OPENAI_REASONING_EFFORT / PERPLEXITY_MODEL （可选）覆盖默认模型（gpt-6-luna / low / sonar）
      - name: 触发远程部署
        env:
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S_OPENROUTER_CHATGPT_MODEL: ${{ secrets.OPENROUTER_CHATGPT_MODEL }}
          S_OPENROUTER_PERPLEXITY_MODEL: ${{ secrets.OPENROUTER_PERPLEXITY_MODEL }}
          S_OPENROUTER_GEMINI_MODEL: ${{ secrets.OPENROUTER_GEMINI_MODEL }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          S_PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          S_PERPLEXITY_BASE_URL: ${{ secrets.PERPLEXITY_BASE_URL }}
          S_OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          S_OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
          S_PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL }}
          S_MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}
          S_MYSQL_ADMIN_USER: ${{ secrets.MYSQL_ADMIN_USER }}
          S_MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          S_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          S_ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="deploy force"
          else
            CMD="deploy"
          fi

          BLOB=""
          # add 变量名 目标环境变量名：去掉首尾空白，含换行则报错，空值跳过
          add() {
            local v
            v="$(printf '%s' "${!1}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$v" ] && return 0
            case "$v" in
              *$'\n'*|*$'\r'*) echo "::error::Secret ${1#S_} 含有换行，请重新粘贴为单行"; exit 1 ;;
            esac
            BLOB="${BLOB}${2}=${v}"$'\n'
          }
          add S_GEMINI_API_KEY          GEMINI_API_KEY
          add S_OPENROUTER_API_KEY      OPENROUTER_API_KEY
          add S_OPENROUTER_CHATGPT_MODEL OPENROUTER_CHATGPT_MODEL
          add S_OPENROUTER_PERPLEXITY_MODEL OPENROUTER_PERPLEXITY_MODEL
          add S_OPENROUTER_GEMINI_MODEL OPENROUTER_GEMINI_MODEL
          add S_OPENAI_API_KEY          OPENAI_API_KEY
          add S_OPENAI_BASE_URL         OPENAI_BASE_URL
          add S_PERPLEXITY_API_KEY      PERPLEXITY_API_KEY
          add S_PERPLEXITY_BASE_URL     PERPLEXITY_BASE_URL
          add S_OPENAI_MODEL            OPENAI_MODEL
          add S_OPENAI_REASONING_EFFORT OPENAI_REASONING_EFFORT
          add S_PERPLEXITY_MODEL        PERPLEXITY_MODEL
          add S_MYSQL_APP_PASSWORD      MYSQL_PASSWORD
          add S_MYSQL_ADMIN_USER        MYSQL_ADMIN_USER
          add S_MYSQL_ADMIN_PASSWORD    MYSQL_ADMIN_PASSWORD
          add S_ADMIN_EMAIL             CW_ADMIN_EMAIL
          add S_ADMIN_INITIAL_PASSWORD  CW_ADMIN_PASSWORD

          if [ -n "$BLOB" ]; then
            HEX="$(printf '%s' "$BLOB" | od -An -v -tx1 | tr -d ' \n')"
            echo "::add-mask::$HEX"
            REMOTE_CMD="$CMD CW_ENV=$HEX"
          else
            REMOTE_CMD="$CMD"
          fi

          # 健康检查阶段据此判断是否要求数据库就绪
          if [ -n "$S_MYSQL_APP_PASSWORD" ]; then echo "EXPECT_DB=1" >> "$GITHUB_ENV"; fi
          if [ -n "$S_GEMINI_API_KEY" ]; then echo "EXPECT_GEMINI=1" >> "$GITHUB_ENV"; fi
          if [ -n "$S_OPENAI_API_KEY" ] || [ -n "$S_OPENROUTER_API_KEY" ]; then echo "EXPECT_OPENAI=1" >> "$GITHUB_ENV"; fi
          if [ -n "$S_PERPLEXITY_API_KEY" ] || [ -n "$S_OPENROUTER_API_KEY" ]; then echo "EXPECT_PERPLEXITY=1" >> "$GITHUB_ENV"; fi

          echo "远程指令：$CMD（携带 $(printf '%s' "$BLOB" | grep -c .) 项运行时配置）  目标：$SSH_USER@$SSH_HOST"

          set +e
          OUT=$(ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "$SSH_USER@$SSH_HOST" \
              "$REMOTE_CMD" 2>&1)
          RC=$?
          set -e

          printf '%s\n' "$OUT"

          if [ "$RC" -ne 0 ]; then
            SUMMARY=$(printf '%s' "$OUT" | tail -4 | tr '\n' ' ')
            echo "::error::SSH 部署失败（退出码 $RC）。末尾输出：$SUMMARY"
            exit "$RC"
          fi

      # ── ④ 部署后健康检查 ──────────────────────────────────────────────
      # 数据库初始化失败时服务不会下线（AI 接口与静态站点照常），但这里会让任务失败并打印原因，
      # 原因取自 /api/health 的 dbIssue，不含敏感信息。
      - name: 部署后健康检查
        run: |
          sleep 3
          BODY=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 \
                   "http://$SSH_HOST/api/health" || echo 000)
            echo "第 $i 次探测 /api/health -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              BODY=$(cat /tmp/health.json)
              break
            fi
            sleep 5
          done
          if [ -z "$BODY" ]; then
            echo "::error::健康检查未通过，请登录服务器执行 docker logs cloudwise 排查"
            exit 1
          fi
          echo "站点健康：$BODY"

          if [ "${EXPECT_DB:-}" = "1" ]; then
            DB_STATUS=$(printf '%s' "$BODY" | jq -r '.dbStatus // "unknown"')
            if [ "$DB_STATUS" != "ok" ]; then
              DB_ISSUE=$(printf '%s' "$BODY" | jq -r '.dbIssue // ""')
              echo "::error::站点已上线，但数据库未就绪：dbStatus=$DB_STATUS dbIssue=$DB_ISSUE"
              echo "  unknown = 线上还是旧版后端（不含数据库支持）；failed = 见 dbIssue 的阶段与 MySQL 错误码"
              echo "  bootstrap/mysql error 1045 = 管理员账号或密码不对；migrate/connect = 专用账号密码与库里不一致"
              exit 1
            fi
            echo "数据库就绪"
          fi
          if [ "${EXPECT_GEMINI:-}" = "1" ]; then
            if [ "$(printf '%s' "$BODY" | jq -r '.hasGeminiKey // false')" != "true" ]; then
              echo "::warning::已配置 GEMINI_API_KEY，但线上后端未读到 key（AI 接口正在使用 fallback）"
            fi
          fi
          # 测评平台只在 Gemini 也可用时启用（分析依赖 Gemini），读不到时只告警不失败
          ENGINES=$(printf '%s' "$BODY" | jq -r '(.auditEngines // []) | join(",")')
          echo "AI 可见性测评平台：${ENGINES:-（无，测评只出示例）}"
          for pair in "EXPECT_OPENAI:openai" "EXPECT_PERPLEXITY:perplexity"; do
            flag="${pair%%:*}"; id="${pair##*:}"
            if [ "${!flag:-}" = "1" ] && ! printf ',%s,' "$ENGINES" | grep -q ",$id,"; then
              echo "::warning::已配置 ${id} 的 key，但线上测评未启用该平台（需同时配置 GEMINI_API_KEY）"
            fi
          done

      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
